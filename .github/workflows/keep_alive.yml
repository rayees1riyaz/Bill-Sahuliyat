name: Keep Render App Awake

on:
  schedule:
    # Triggers every 10 minutes to prevent Render free tier from going to sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Route
        run: |
          # Replace with your Render URL or set RENDER_APP_URL in GitHub Repository Secrets
          APP_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://bill-sahuliyat.onrender.com/up"
          fi
          echo "Pinging: $APP_URL"
          curl -s -o /dev/null -w "%{http_code}" "$APP_URL"
